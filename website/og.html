<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background:
          radial-gradient(circle at 1px 1px, rgba(10, 14, 12, 0.06) 1px, transparent 0)
            0 0 / 24px 24px,
          #f1f3ee;
        color: #0a0e0c;
        font-family: "Archivo", sans-serif;
      }
      .og {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 54px 64px;
        border-top: 1px solid rgba(10, 14, 12, 0.2);
      }
      header, footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      header span:first-child {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 50px;
        height: 32px;
        border: 1px solid #0a0e0c;
        font-size: 10px;
      }
      h1 {
        margin: 0;
        font-size: 142px;
        font-variation-settings: "wdth" 122;
        font-weight: 500;
        letter-spacing: -0.07em;
        line-height: 0.8;
      }
      h1 em {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.03em;
      }
      footer span:last-child { color: #68716b; }
      .dot {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-left: 10px;
        border-radius: 50%;
        background: #8bbf12;
        vertical-align: 0.08em;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <header>
        <span>W/SF</span>
        <span>Salesforce-native / Meta Cloud API</span>
      </header>
      <h1>WhatsApp,<br /><em>inside</em> the org<span class="dot" aria-hidden="true"></span></h1>
      <footer>
        <span>The conversation layer for Salesforce.</span>
        <span>No middleware / no second data store</span>
      </footer>
    </div>
  </body>
</html>
